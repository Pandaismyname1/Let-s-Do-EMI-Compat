name: Publish on GitHub, CurseForge & Modrinth
on: [ workflow_dispatch ]

env:
  MINECRAFT_VERSION: 1.21.1
  JAVA_VERSION: 21
  VERSION: 2.0.0
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: ${{env.JAVA_VERSION}}

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish Fabric (CurseForge/Modrinth/GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1063821
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"

          modrinth-id: k6hi4lMv
          modrinth-token: "${{env.MODRINTH_TOKEN}}"

          github-tag: "v${{env.VERSION}}+${{env.MINECRAFT_VERSION}}+fabric"
          github-token: "${{env.GITHUB_TOKEN}}"

          name: "${{ env.VERSION }}+${{ env.MINECRAFT_VERSION }}+fabric"
          files: "fabric/build/libs/emi-letsdo-compat-${{env.VERSION}}.jar"
          version: "${{env.VERSION}}+${{env.MINECRAFT_VERSION}}+fabric"
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: fabric
          game-versions: "${{env.MINECRAFT_VERSION}}"
          java: "${{env.JAVA_VERSION}}"
          dependencies: |

      - name: Publish Forge (CurseForge/Modrinth/GitHub)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1063821
          curseforge-token: "${{env.CURSEFORGE_TOKEN}}"

          modrinth-id: k6hi4lMv
          modrinth-token: "${{env.MODRINTH_TOKEN}}"

          github-tag: "v${{env.VERSION}}+${{env.MINECRAFT_VERSION}}+forge"
          github-token: "${{env.GITHUB_TOKEN}}"

          name: "${{ env.VERSION }}+${{ env.MINECRAFT_VERSION }}+forge"
          files: "forge/build/libs/emi-letsdo-compat-${{env.VERSION}}.jar"
          version: "${{env.VERSION}}+${{env.MINECRAFT_VERSION}}+forge"
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: neoforge
          game-versions: "${{env.MINECRAFT_VERSION}}"
          java: "${{env.JAVA_VERSION}}"