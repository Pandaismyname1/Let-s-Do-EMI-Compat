plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    repositories {
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            url "https://cursemaven.com"
        }
        maven {
            url = 'https://maven.ladysnake.org/releases'
        }
    }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
    modImplementation "curse.maven:lets-do-vinery-704465:7218656"
//    modImplementation "curse.maven:lets-do-bakery-886559:5528401"
    modImplementation "curse.maven:lets-do-meadow-821483:7064941"
//    modImplementation "curse.maven:lets-do-candlelight-846962:5427654"
//    modImplementation "curse.maven:lets-do-brewery-971636:5427505"
    modImplementation "curse.maven:lets-do-herbal-brews-951221:7001993"
    modImplementation "curse.maven:lets-do-beachparty-858691:7021365"
    modImplementation "curse.maven:lets-do-farm-charm-1038103:7081974"
    modImplementation "curse.maven:lets-do-bakery-farm-charm-compat-1038130:7032848"
    modImplementation "curse.maven:lets-do-candlelight-farm-charm-compat-1038117:7057791"
    modImplementation "curse.maven:lets-do-brewery-farm-charm-compat-1038106:7032523"

    modLocalRuntime "dev.emi:trinkets:3.10.0"
    modLocalRuntime "curse.maven:cloth-config-348521:5729125"
    modLocalRuntime "dev.emi:emi-fabric:${rootProject.emi_version}+${rootProject.minecraft_version}"
}


processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
