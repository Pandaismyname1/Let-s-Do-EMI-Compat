plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    repositories {
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        repositories {
            maven {
                url "https://cursemaven.com"
            }
        }
    }

    neoForge "net.neoforged:neoforge:${neo_forge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    modImplementation "curse.maven:lets-do-vinery-704465:7218579"
//    modImplementation "curse.maven:lets-do-bakery-886559:5528402"
    modImplementation "curse.maven:lets-do-meadow-821483:7069148"
//    modImplementation "curse.maven:lets-do-candlelight-846962:5427646"
//    modImplementation "curse.maven:lets-do-brewery-971636:5427504"
    modImplementation "curse.maven:lets-do-herbal-brews-951221:7001991"
    modImplementation "curse.maven:lets-do-beachparty-858691:7021359"
    modImplementation "curse.maven:lets-do-farm-charm-1038103:7081972"
    modImplementation "curse.maven:lets-do-bakery-farm-charm-compat-1038130:7032843"
    modImplementation "curse.maven:lets-do-candlelight-farm-charm-compat-1038117:7066667"
    modImplementation "curse.maven:lets-do-brewery-farm-charm-compat-1038106:7032522"

    modRuntimeOnly "curse.maven:curios-309927:6529130"
    modRuntimeOnly "dev.emi:emi-neoforge:${rootProject.emi_version}+${rootProject.minecraft_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}